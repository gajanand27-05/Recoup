[project]
name = "recoup"
version = "0.1.0"
description = "Post-halt subscription payment recovery with a measured holdout arm"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=2.1",
    "scipy>=1.14",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]
# Model SDKs are optional and imported lazily inside the client that needs one,
# so CI installs neither and the suite runs without either. Install the one
# matching RECOUP_LLM_MODEL to actually call a model.
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
recoup = "recoup.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Needs the key matching RECOUP_LLM_MODEL (GEMINI_API_KEY by default) and that
# model's SDK extra installed.
markers = ["llm: makes live API calls"]
# Deselected by DEFAULT, not only by CI's explicit -m. Without this, `pytest -v`
# -- the command CLAUDE.md tells me to run -- goes red on any machine with no key
# or no SDK, while CI stays green because it passes -m "not llm" by hand. A suite
# that is green only under the flags CI happens to use is not a green suite.
# Opt in with `pytest -m llm`: a later -m overrides this one, and the eval then
# RAISES on a missing key rather than skipping, because at that point you asked
# for it and a silently-skipped eval is how "not run" comes to look like "passed".
addopts = ["-m", "not llm"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
